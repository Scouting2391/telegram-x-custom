name: Publish F-Droid repository

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Build custom Telegram X update]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: fdroid-repository
  cancel-in-progress: false

jobs:
  index:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: signing
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Install official F-Droid tools
        run: python -m pip install 'fdroidserver==2.4.5'
      - name: Validate repository trust decisions
        run: python -m unittest discover -s tests -v
      - name: Generate and verify signed indexes from the current custom release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TGX_KEYSTORE_BASE64: ${{ secrets.TGX_KEYSTORE_BASE64 }}
          TGX_KEYSTORE_PASSWORD: ${{ secrets.TGX_KEYSTORE_PASSWORD }}
        run: >-
          python scripts/fdroid_repo.py build
          --build-tools "$ANDROID_HOME/build-tools/35.0.0"
          --site-dir fdroid-site
      - name: Upload only the verified public site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: fdroid-site
          retention-days: 1

  deploy:
    needs: index
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Publish verified repository with GitHub Pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
