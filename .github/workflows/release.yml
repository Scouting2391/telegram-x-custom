name: Build custom Telegram X update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - .github/custom-revisions.json
      - scripts/build_custom.py
      - scripts/release_pipeline.py
      - updater/**
      - tests/**
  workflow_dispatch:
    inputs:
      check_only:
        description: "Check compatibility with the latest official APK without publishing"
        required: false
        default: false
        type: boolean
      revision:
        description: "Custom revision for the latest stable upstream release (1-99)"
        required: true
        default: "1"
        type: string
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: custom-telegram-x-release
  cancel-in-progress: false

env:
  TGX_REVISION: ${{ inputs.revision || '1' }}

jobs:
  discover:
    # Manual runs of a branch other than the trusted default branch do nothing.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      needs_build: ${{ steps.release.outputs.needs_build }}
      upstream_id: ${{ steps.release.outputs.upstream_id }}
      custom_tag: ${{ steps.release.outputs.custom_tag }}
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Validate release helpers
        run: python -m unittest discover -s tests -v
      - id: release
        name: Find latest stable upstream APK
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/release_pipeline.py discover
          --repository "$GITHUB_REPOSITORY"
          --revision "$TGX_REVISION"

  build:
    needs: discover
    if: needs.discover.outputs.needs_build == 'true' || inputs.check_only == true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: signing
    env:
      TGX_REVISION: ${{ needs.discover.outputs.revision }}
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare verified inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_ID: ${{ needs.discover.outputs.upstream_id }}
        run: >-
          python scripts/release_pipeline.py prepare
          --release-id "$UPSTREAM_ID"
          --output-dir .ci
      - name: Verify fixed Android SDK components provided by the runner
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -f "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar"
          test -f "$ANDROID_HOME/build-tools/35.0.0/lib/d8.jar"
      - name: Verify updater trust decisions and push diagnostics
        run: >-
          python tests/run_updater_tests.py
          --java-home "$JAVA_HOME"
          --android-jar "$ANDROID_HOME/platforms/android-35/android.jar"
      - name: Check compatibility without signing or publishing
        if: inputs.check_only == true
        run: python scripts/release_pipeline.py check-compatibility
      - name: Build, sign, and verify
        if: inputs.check_only != true
        env:
          TGX_KEYSTORE_BASE64: ${{ secrets.TGX_KEYSTORE_BASE64 }}
          TGX_KEYSTORE_PASSWORD: ${{ secrets.TGX_KEYSTORE_PASSWORD }}
        run: python scripts/release_pipeline.py build --revision "$TGX_REVISION"
      - name: Remove temporary signing files
        if: always()
        run: python scripts/release_pipeline.py clean-secrets
      - name: Summarize patch compatibility
        if: always()
        run: python scripts/release_pipeline.py summarize
      - name: Save public maintenance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maintenance-report
          path: |
            dist/compatibility-report.json
            dist/bytecode-changes.patch
            .ci/upstream-release.json
          if-no-files-found: warn
          retention-days: 7
      - id: upload
        if: inputs.check_only != true
        name: Pass only verified public release files to publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-release
          path: |
            dist/*.apk
            dist/tgx-update.json
            dist/verification.json
            dist/upstream-release.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [discover, build]
    if: needs.build.result == 'success' && inputs.check_only != true && needs.discover.outputs.needs_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
          merge-multiple: true
      - name: Publish after GitHub asset digests match
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CUSTOM_TAG: ${{ needs.discover.outputs.custom_tag }}
        run: >-
          python scripts/release_pipeline.py publish
          --repository "$GITHUB_REPOSITORY"
          --tag "$CUSTOM_TAG"
          --commit "$GITHUB_SHA"
          --output-dir dist
